[package]
name = "akanetease-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[features]
default = ["audio"]
audio = ["dep:gstreamer"]
mpris = ["audio", "dep:mpris-server"]
test-support = []

[dependencies]
gstreamer = { version = "0.24", optional = true }
mpris-server = { version = "0.10", optional = true, default-features = false, features = ["tokio"] }
rand = "0.9"
base64 = "0.22"
hex = "0.4"
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
cookie_store = "0.22"
qrcode = { version = "0.14", default-features = false }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "io-std", "sync", "process", "signal"] }

[[bin]]
name = "aka-backend"
path = "src/main.rs"

[dev-dependencies]
futures-util = "0.3"
